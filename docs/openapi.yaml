openapi: 3.1.0
info:
  title: Tech-Challenge-Oficina API
  version: 0.1.0
  description: API do Sistema Integrado de Atendimento e Execucao de Servicos da oficina.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Servidor da aplicacao
paths:
  /admin/auth/login:
    post:
      operationId: loginAdmin
      summary: Autentica um administrador
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao concluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/auth/refresh:
    post:
      operationId: refreshAdminToken
      summary: Renova um JWT dentro da janela de renovacao
      description: O proprio JWT anterior deve ser enviado como Bearer, mesmo se o prazo de acesso estiver expirado.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/auth/me:
    get:
      operationId: getAuthenticatedAdmin
      summary: Valida o JWT e retorna o administrador autenticado
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Administrador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/customers:
    get:
      operationId: listCustomers
      summary: Lista clientes
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCustomer
      summary: Cadastra um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/customers/{customer}:
    parameters:
      - name: customer
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showCustomer
      summary: Detalha um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomer
      summary: Atualiza um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCustomer
      summary: Exclui um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cliente excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/vehicles:
    get:
      operationId: listVehicles
      summary: Lista veiculos
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de veiculos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createVehicle
      summary: Cadastra um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Veiculo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/vehicles/{vehicle}:
    parameters:
      - name: vehicle
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showVehicle
      summary: Detalha um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Veiculo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateVehicle
      summary: Atualiza um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Veiculo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteVehicle
      summary: Exclui um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Veiculo excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/services:
    get:
      operationId: listServices
      summary: Lista servicos
      tags:
        - Services
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de servicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createService
      summary: Cadastra um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        '201':
          description: Servico cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/services/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showService
      summary: Detalha um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Servico encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateService
      summary: Atualiza um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        '200':
          description: Servico atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteService
      summary: Exclui um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Servico excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/inventory-items:
    get:
      operationId: listInventoryItems
      summary: Lista pecas e insumos
      tags:
        - Inventory
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de itens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createInventoryItem
      summary: Cadastra uma peca ou insumo
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryItemRequest'
      responses:
        '201':
          description: Item cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/inventory-items/{inventoryItem}:
    parameters:
      - $ref: '#/components/parameters/InventoryItemId'
    get:
      operationId: showInventoryItem
      summary: Detalha uma peca ou insumo
      tags:
        - Inventory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Item encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateInventoryItem
      summary: Atualiza os dados de catalogo de uma peca ou insumo
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryItemRequest'
      responses:
        '200':
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteInventoryItem
      summary: Exclui um item sem historico de estoque
      tags:
        - Inventory
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Item excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/inventory-items/{inventoryItem}/stock:
    parameters:
      - $ref: '#/components/parameters/InventoryItemId'
    put:
      operationId: adjustInventoryItemStock
      summary: Define manualmente o saldo de estoque e registra a movimentacao
      tags:
        - Inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/inventory-items/{inventoryItem}/movements:
    parameters:
      - $ref: '#/components/parameters/InventoryItemId'
    get:
      operationId: listInventoryItemMovements
      summary: Lista o historico de movimentacoes de um item
      tags:
        - Inventory
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Historico paginado de movimentacoes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/service-orders:
    get:
      operationId: listServiceOrders
      summary: Lista as Ordens de Servico
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de Ordens de Servico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createServiceOrder
      summary: Cria uma Ordem de Servico completa com orcamento calculado
      description: Captura os valores atuais como snapshots. O estoque permanece inalterado ate a aprovacao do orcamento.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceOrderRequest'
      responses:
        '201':
          description: Ordem de Servico criada com status received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/service-orders-metrics/execution-time:
    get:
      operationId: getServiceOrderExecutionTimeMetrics
      summary: Consulta o tempo medio do ciclo e de cada status
      description: Considera somente Ordens de Servico entregues com todos os instantes do ciclo. Sem filtros, retorna o resultado geral. O periodo se aplica ao instante de entrega.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      parameters:
        - name: delivered_from
          in: query
          schema:
            type: string
            format: date
        - name: delivered_to
          in: query
          schema:
            type: string
            format: date
        - name: service_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Medias em segundos e quantidade de ordens elegiveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderExecutionTimeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/service-orders/{serviceOrder}:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    get:
      operationId: getServiceOrder
      summary: Detalha uma Ordem de Servico
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalhes da Ordem de Servico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/service-orders/{serviceOrder}/diagnosis/start:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: startServiceOrderDiagnosis
      summary: Inicia o diagnostico da Ordem de Servico
      description: Altera automaticamente o status de received para in_diagnosis e registra o instante da transicao.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Diagnostico iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-orders/{serviceOrder}/diagnosis/complete:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: completeServiceOrderDiagnosis
      summary: Conclui o diagnostico e disponibiliza o orcamento
      description: Valida a composicao persistida, altera automaticamente de in_diagnosis para awaiting_approval e registra o instante da disponibilizacao pela API.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Diagnostico concluido e orcamento disponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-orders/{serviceOrder}/cancel:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: cancelServiceOrder
      summary: Cancela uma Ordem de Servico antes da execucao
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ordem cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-orders/{serviceOrder}/finalize:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: finalizeServiceOrder
      summary: Finaliza a execucao de uma Ordem de Servico
      description: Altera exclusivamente de in_execution para finalized e registra finalized_at.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Execucao finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-orders/{serviceOrder}/deliver:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: deliverServiceOrder
      summary: Registra a entrega de uma Ordem de Servico finalizada
      description: Altera exclusivamente de finalized para delivered e registra delivered_at.
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Veiculo entregue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/service-orders/{serviceOrder}/additional-repairs:
    parameters:
      - $ref: '#/components/parameters/ServiceOrderId'
    post:
      operationId: addServiceOrderAdditionalRepairs
      summary: Adiciona servicos e recalcula o orcamento antes da aprovacao
      tags:
        - Service Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdditionalRepairsRequest'
      responses:
        '200':
          description: Reparos adicionados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /client/service-orders/tracking:
    post:
      operationId: trackClientServiceOrder
      summary: Consulta uma OS com documento do cliente e token aleatorio
      tags:
        - Client Service Orders
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackServiceOrderRequest'
      responses:
        '200':
          description: Acompanhamento da Ordem de Servico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientServiceOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /client/service-orders/approve:
    post:
      operationId: approveClientServiceOrderBudget
      summary: Aprova o orcamento com documento e token da OS
      description: Bloqueia a OS e os itens de estoque, valida todos os saldos e realiza a baixa com historico na mesma transacao que inicia a execucao. Estoque insuficiente ou aprovacao repetida retorna conflito sem alteracao parcial.
      tags:
        - Client Service Orders
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackServiceOrderRequest'
      responses:
        '200':
          description: Orcamento aprovado e execucao iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientServiceOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  parameters:
    InventoryItemId:
      name: inventoryItem
      in: path
      required: true
      schema:
        type: integer
    ServiceOrderId:
      name: serviceOrder
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Credenciais ou token invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Dados de entrada invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflito com o estado persistido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: dev@email.com
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: Validade do acesso em segundos.
        refresh_expires_in:
          type: integer
          description: Janela total de renovacao em segundos.
    AdminResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - name
            - email
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
    CustomerRequest:
      type: object
      required:
        - name
        - document
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria da Silva
        document:
          type: string
          maxLength: 18
          description: CPF ou CNPJ, com ou sem pontuacao.
          example: 529.982.247-25
    Customer:
      type: object
      required:
        - id
        - name
        - document
        - document_type
      properties:
        id:
          type: integer
        name:
          type: string
        document:
          type: string
          description: CPF ou CNPJ normalizado, somente com digitos.
        document_type:
          type: string
          enum:
            - cpf
            - cnpj
    CustomerResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Customer'
    CustomerCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    VehicleRequest:
      type: object
      required:
        - customer_id
        - license_plate
        - brand
        - model
        - year
      properties:
        customer_id:
          type: integer
        license_plate:
          type: string
          maxLength: 10
          description: Placa brasileira antiga ou Mercosul, com ou sem separadores.
          example: BRA1E23
        brand:
          type: string
          maxLength: 100
          example: Volkswagen
        model:
          type: string
          maxLength: 100
          example: Gol
        year:
          type: integer
          minimum: 1886
          example: 2020
    Vehicle:
      type: object
      required:
        - id
        - customer_id
        - license_plate
        - brand
        - model
        - year
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        license_plate:
          type: string
          pattern: '^[A-Z]{3}([0-9]{4}|[0-9][A-Z][0-9]{2})$'
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
    VehicleResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    VehicleCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ServiceRequest:
      type: object
      required:
        - name
        - unit_price
      properties:
        name:
          type: string
          maxLength: 255
          example: Troca de oleo
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
          example: 15990
    Service:
      type: object
      required:
        - id
        - name
        - unit_price
      properties:
        id:
          type: integer
        name:
          type: string
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
    ServiceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Service'
    ServiceCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    CreateInventoryItemRequest:
      type: object
      required:
        - name
        - type
        - unit_price
        - quantity_available
      properties:
        name:
          type: string
          maxLength: 255
          example: Filtro de oleo
        type:
          type: string
          enum:
            - part
            - supply
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
          example: 4590
        quantity_available:
          type: integer
          minimum: 0
          maximum: 2147483647
          example: 10
    UpdateInventoryItemRequest:
      type: object
      required:
        - name
        - type
        - unit_price
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
            - part
            - supply
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
    AdjustStockRequest:
      type: object
      required:
        - quantity_available
      properties:
        quantity_available:
          type: integer
          minimum: 0
          maximum: 2147483647
    InventoryItem:
      type: object
      required:
        - id
        - name
        - type
        - unit_price
        - quantity_available
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
            - part
            - supply
        unit_price:
          type: integer
          format: int64
          minimum: 0
        quantity_available:
          type: integer
          minimum: 0
    InventoryItemResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/InventoryItem'
    InventoryItemCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    StockMovement:
      type: object
      required:
        - id
        - inventory_item_id
        - admin_user_id
        - service_order_id
        - type
        - quantity_change
        - quantity_before
        - quantity_after
        - created_at
      properties:
        id:
          type: integer
        inventory_item_id:
          type: integer
        admin_user_id:
          type:
            - integer
            - 'null'
        service_order_id:
          type:
            - integer
            - 'null'
        type:
          type: string
          enum:
            - initial_stock
            - manual_adjustment
            - service_order_consumption
        quantity_change:
          type: integer
        quantity_before:
          type: integer
          minimum: 0
        quantity_after:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    StockMovementCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    RequestedService:
      type: object
      required:
        - service_id
        - quantity
      properties:
        service_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
    RequestedInventoryItem:
      type: object
      required:
        - inventory_item_id
        - quantity
      properties:
        inventory_item_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
    CreateServiceOrderRequest:
      type: object
      required:
        - customer_document
        - vehicle_id
        - services
        - inventory_items
      properties:
        customer_document:
          type: string
          description: CPF ou CNPJ, com ou sem pontuacao.
          example: 529.982.247-25
        vehicle_id:
          type: integer
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestedService'
        inventory_items:
          type: array
          items:
            $ref: '#/components/schemas/RequestedInventoryItem'
    AdditionalRepairsRequest:
      type: object
      required:
        - services
      properties:
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestedService'
    TrackServiceOrderRequest:
      type: object
      required:
        - customer_document
        - tracking_token
      properties:
        customer_document:
          type: string
        tracking_token:
          type: string
          minLength: 64
          maxLength: 64
    ServiceOrderServiceItem:
      type: object
      required:
        - service_id
        - quantity
        - unit_price
        - subtotal
      properties:
        service_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          format: int64
          minimum: 0
        subtotal:
          type: integer
          format: int64
          minimum: 0
    ServiceOrderInventoryItem:
      type: object
      required:
        - inventory_item_id
        - type
        - quantity
        - unit_price
        - subtotal
      properties:
        inventory_item_id:
          type: integer
        type:
          type: string
          enum:
            - part
            - supply
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          format: int64
          minimum: 0
        subtotal:
          type: integer
          format: int64
          minimum: 0
    ServiceOrder:
      type: object
      required:
        - id
        - customer_id
        - vehicle_id
        - status
        - received_at
        - diagnosis_started_at
        - awaiting_approval_at
        - execution_started_at
        - finalized_at
        - delivered_at
        - cancelled_at
        - services
        - inventory_items
        - total_amount
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        vehicle_id:
          type: integer
        status:
          type: string
          enum:
            - received
            - in_diagnosis
            - awaiting_approval
            - in_execution
            - finalized
            - delivered
            - cancelled
        received_at:
          type: string
          format: date-time
        diagnosis_started_at:
          type:
            - string
            - 'null'
          format: date-time
        awaiting_approval_at:
          type:
            - string
            - 'null'
          format: date-time
        execution_started_at:
          type:
            - string
            - 'null'
          format: date-time
        finalized_at:
          type:
            - string
            - 'null'
          format: date-time
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        tracking_token:
          type:
            - string
            - 'null'
          description: Retornado somente na criacao administrativa.
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderServiceItem'
        inventory_items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderInventoryItem'
        total_amount:
          type: integer
          format: int64
          minimum: 0
          description: Total calculado pelo servidor em centavos.
    ServiceOrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ServiceOrder'
    ServiceOrderExecutionTimeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - eligible_orders
            - average_total_seconds
            - average_seconds_by_status
          properties:
            eligible_orders:
              type: integer
              minimum: 0
            average_total_seconds:
              type:
                - integer
                - 'null'
              minimum: 0
            average_seconds_by_status:
              type: object
              required:
                - received
                - in_diagnosis
                - awaiting_approval
                - in_execution
                - finalized
              properties:
                received:
                  type:
                    - integer
                    - 'null'
                in_diagnosis:
                  type:
                    - integer
                    - 'null'
                awaiting_approval:
                  type:
                    - integer
                    - 'null'
                in_execution:
                  type:
                    - integer
                    - 'null'
                finalized:
                  type:
                    - integer
                    - 'null'
    ServiceOrderCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrder'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ClientServiceOrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - service_order_id
            - status
            - approval_status
            - total_amount
          properties:
            service_order_id:
              type: integer
            status:
              type: string
            approval_status:
              type: string
              enum:
                - not_available
                - pending
                - approved
            total_amount:
              type: integer
              format: int64
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
