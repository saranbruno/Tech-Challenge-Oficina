openapi: 3.1.0
info:
  title: Tech-Challenge-Oficina API
  version: 0.1.0
  description: API do Sistema Integrado de Atendimento e Execucao de Servicos da oficina.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Servidor da aplicacao
paths:
  /admin/auth/login:
    post:
      operationId: loginAdmin
      summary: Autentica um administrador
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticacao concluida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/auth/refresh:
    post:
      operationId: refreshAdminToken
      summary: Renova um JWT dentro da janela de renovacao
      description: O proprio JWT anterior deve ser enviado como Bearer, mesmo se o prazo de acesso estiver expirado.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/auth/me:
    get:
      operationId: getAuthenticatedAdmin
      summary: Valida o JWT e retorna o administrador autenticado
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Administrador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/customers:
    get:
      operationId: listCustomers
      summary: Lista clientes
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCustomer
      summary: Cadastra um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Cliente cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/customers/{customer}:
    parameters:
      - name: customer
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showCustomer
      summary: Detalha um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomer
      summary: Atualiza um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCustomer
      summary: Exclui um cliente
      tags:
        - Customers
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cliente excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/vehicles:
    get:
      operationId: listVehicles
      summary: Lista veiculos
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de veiculos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createVehicle
      summary: Cadastra um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Veiculo cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/vehicles/{vehicle}:
    parameters:
      - name: vehicle
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showVehicle
      summary: Detalha um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Veiculo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateVehicle
      summary: Atualiza um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Veiculo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteVehicle
      summary: Exclui um veiculo
      tags:
        - Vehicles
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Veiculo excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/services:
    get:
      operationId: listServices
      summary: Lista servicos
      tags:
        - Services
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: Lista paginada de servicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createService
      summary: Cadastra um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        '201':
          description: Servico cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/services/{service}:
    parameters:
      - name: service
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showService
      summary: Detalha um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Servico encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateService
      summary: Atualiza um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest'
      responses:
        '200':
          description: Servico atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteService
      summary: Exclui um servico
      tags:
        - Services
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Servico excluido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Credenciais ou token invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Dados de entrada invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflito com o estado persistido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: dev@email.com
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: Validade do acesso em segundos.
        refresh_expires_in:
          type: integer
          description: Janela total de renovacao em segundos.
    AdminResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - name
            - email
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
              format: email
    CustomerRequest:
      type: object
      required:
        - name
        - document
      properties:
        name:
          type: string
          maxLength: 255
          example: Maria da Silva
        document:
          type: string
          maxLength: 18
          description: CPF ou CNPJ, com ou sem pontuacao.
          example: 529.982.247-25
    Customer:
      type: object
      required:
        - id
        - name
        - document
        - document_type
      properties:
        id:
          type: integer
        name:
          type: string
        document:
          type: string
          description: CPF ou CNPJ normalizado, somente com digitos.
        document_type:
          type: string
          enum:
            - cpf
            - cnpj
    CustomerResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Customer'
    CustomerCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    VehicleRequest:
      type: object
      required:
        - customer_id
        - license_plate
        - brand
        - model
        - year
      properties:
        customer_id:
          type: integer
        license_plate:
          type: string
          maxLength: 10
          description: Placa brasileira antiga ou Mercosul, com ou sem separadores.
          example: BRA1E23
        brand:
          type: string
          maxLength: 100
          example: Volkswagen
        model:
          type: string
          maxLength: 100
          example: Gol
        year:
          type: integer
          minimum: 1886
          example: 2020
    Vehicle:
      type: object
      required:
        - id
        - customer_id
        - license_plate
        - brand
        - model
        - year
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        license_plate:
          type: string
          pattern: '^[A-Z]{3}([0-9]{4}|[0-9][A-Z][0-9]{2})$'
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
    VehicleResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
    VehicleCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ServiceRequest:
      type: object
      required:
        - name
        - unit_price
      properties:
        name:
          type: string
          maxLength: 255
          example: Troca de oleo
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
          example: 15990
    Service:
      type: object
      required:
        - id
        - name
        - unit_price
      properties:
        id:
          type: integer
        name:
          type: string
        unit_price:
          type: integer
          format: int64
          minimum: 0
          description: Valor unitario exato em centavos.
    ServiceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Service'
    ServiceCollection:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
