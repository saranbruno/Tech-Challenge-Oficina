openapi: 3.1.0
info:
  title: Tech-Challenge-Oficina API
  version: 0.1.0
  description: API do Sistema Integrado de Atendimento e Execucao de Servicos da oficina.
servers:
  - url: http://localhost:8081/api
    description: Ambiente local com Docker
paths: {}
components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
