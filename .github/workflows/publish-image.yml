name: Publicar imagem GHCR

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/saranbruno/tech-challenge-oficina

jobs:
  publish:
    name: Build e publicacao
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/fase-2'
    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Definir metadados da imagem
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=fase-2
          labels: |
            org.opencontainers.image.source=https://github.com/saranbruno/Tech-Challenge-Oficina
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Construir e publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
