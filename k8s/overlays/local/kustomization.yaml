apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina
resources:
  - ../../base
  - mailpit.yaml
patches:
  - path: configmap-patch.yaml
secretGenerator:
  - name: oficina-secrets
    behavior: replace
    literals:
      - APP_KEY=base64:bG9jYWwtYXBwLWtleS1ub3Qtc2VjcmV0
      - DB_USERNAME=oficina
      - DB_PASSWORD=local-only-change-me
      - JWT_SECRET=local-only-jwt-secret-change-me
      - SERVICE_ORDER_WEBHOOK_SECRET=local-only-webhook-change-me
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - TWILIO_ACCOUNT_SID=
      - TWILIO_AUTH_TOKEN=
      - TWILIO_FROM=
