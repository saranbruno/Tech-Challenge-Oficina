apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: oficina
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: ghcr.io/axllent/mailpit:v1.30.6
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: oficina
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: mailpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
