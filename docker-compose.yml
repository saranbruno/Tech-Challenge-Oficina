services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8081}:8000"
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$response = @file_get_contents(\"http://127.0.0.1:8000/up\"); exit($$response === false ? 1 : 0);'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - oficina

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.6
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oficina

  postgres:
    image: postgres:18.4-alpine
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - oficina

networks:
  oficina:

volumes:
  postgres_data:
